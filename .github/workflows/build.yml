name: Build APK & Windows

# روی هر push و همچنین دستیِ دکمه‌ای اجرا می‌شود.
on:
  push:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- اندروید
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MafiaGhab-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- ویندوز
  windows:
    name: Windows (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Bundle ffmpeg.exe / ffprobe.exe
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          $rel = "build/windows/x64/runner/Release"
          $ffmpeg  = Get-ChildItem -Path ffmpeg_dl -Recurse -Filter ffmpeg.exe  | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path ffmpeg_dl -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ffmpeg.FullName  "$rel/ffmpeg.exe"  -Force
          Copy-Item $ffprobe.FullName "$rel/ffprobe.exe" -Force
          Get-ChildItem $rel

      - name: Zip Windows build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath MafiaGhab-Windows.zip -Force

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: MafiaGhab-Windows
          path: MafiaGhab-Windows.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- انتشار (Release)
  # هر دو فایل را در یک Release با برچسب «latest» می‌گذارد تا لینک دانلودِ
  # مستقیم و واضح داشته باشی (APK بدون zip اضافه؛ روی گوشی یک کلیک و نصب).
  release:
    name: Publish Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare files
        run: |
          mkdir -p out
          cp dist/MafiaGhab-Android-APK/app-release.apk out/MafiaGhab.apk
          cp dist/MafiaGhab-Windows/MafiaGhab-Windows.zip out/MafiaGhab-Windows.zip
          ls -la out

      - name: Create/update "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -R "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create latest -R "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            -t "آخرین نسخه — استودیوی مافیای قاب" \
            --notes "APK اندروید و نسخهٔ ویندوز (ffmpeg داخلش هست). با هر بار push این‌جا به‌روز می‌شود." \
            out/MafiaGhab.apk out/MafiaGhab-Windows.zip
