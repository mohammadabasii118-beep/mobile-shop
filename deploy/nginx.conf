# فقط مسیر کال‌بک زرین‌پال را به ربات بفرستید؛ بقیه مسیرهای دامنه (مثل /pg/StartPay/) دست نخورد.
server {
    listen 443 ssl;
    server_name sub.pclproclubss.ir;
    # ssl_certificate ... (مثلاً با certbot)

    location /zarinpal/callback {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
