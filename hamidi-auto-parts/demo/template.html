<title>فروشگاه حمیدی</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="نسخه نمایشی فروشگاه اینترنتی لوازم یدکی نیسان و هوندا — HAMIDI AUTO PARTS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: sticky store header → full-width dark bands for heroes, white catalogue body in a 1320px column. Single committed look (brand colours set by the client). */
:root {
  --ink: #0b0b0d; --ink-2: #16161a; --red: #e10600; --red-d: #b00500; --red-soft: #fff0ef;
  --bg: #ffffff; --soft: #f4f4f6; --line: #e5e5ea; --tx: #0b0b0d; --tx-2: #55555e; --tx-3: #6f6f78;
  --ok: #0f8a4b; --warn: #b26a00; --wa: #25d366;
  --font: "Vazirmatn", Tahoma, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 16px; --r-lg: 24px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--tx); font-family: var(--font); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
img { max-width: 100%; display: block; }
h1, h2, h3 { text-wrap: balance; line-height: 1.35; margin: 0; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.wrap { width: 100%; max-width: 1320px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ltr { direction: ltr; unicode-bidi: isolate; font-family: var(--mono); }
.muted { color: var(--tx-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.carbon { background-color: #0e0e10; background-image: radial-gradient(circle at 25% 25%, rgb(255 255 255 / .04) 1px, transparent 1.5px), radial-gradient(circle at 75% 75%, rgb(255 255 255 / .04) 1px, transparent 1.5px); background-size: 6px 6px; color: #fff; }
.grid-bg { position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(to right, rgb(255 255 255 / .05) 1px, transparent 1px), linear-gradient(to bottom, rgb(255 255 255 / .05) 1px, transparent 1px); background-size: 44px 44px; -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%); mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%); }
.glow { position: absolute; border-radius: 50%; background: rgb(225 6 0 / .3); filter: blur(110px); pointer-events: none; }
.studio { background: radial-gradient(120% 90% at 50% 30%, #fff 0%, #f1f1f3 55%, #e5e5e9 100%); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 12px; font-weight: 700; font-size: 14px; white-space: nowrap; transition: background .2s, transform .1s, box-shadow .2s, border-color .2s; }
.btn:active { transform: scale(.97); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn-red { background: var(--red); color: #fff; box-shadow: 0 8px 20px -8px rgb(225 6 0 / .7); }
.btn-red:hover { background: var(--red-d); }
.btn-dark { background: var(--ink); color: #fff; }
.btn-dark:hover { background: var(--red); }
.btn-out { border: 1px solid var(--line); background: #fff; }
.btn-out:hover { border-color: var(--ink); }
.btn-ghost-w { border: 1px solid rgb(255 255 255 / .2); background: rgb(255 255 255 / .05); color: #fff; }
.btn-ghost-w:hover { background: #fff; color: var(--ink); }
.btn-wa { background: var(--wa); color: #fff; }
.btn-sm { height: 36px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn-lg { height: 52px; padding: 0 26px; font-size: 15px; border-radius: 14px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.btn.done { background: var(--ok); box-shadow: none; }

/* header */
.topbar { font-size: 12px; color: #cfcfd4; }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 36px; }
.topbar .t-items { display: flex; gap: 20px; }
.topbar .t-items span { display: inline-flex; align-items: center; gap: 6px; }
.topbar svg { width: 14px; height: 14px; color: var(--red); }
header.main { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: #fff; border-bottom: 1px solid var(--line); }
.h-row { display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo svg { width: 44px; height: 44px; transition: transform .5s; flex: none; }
.logo:hover svg { transform: rotate(30deg); }
.logo b { display: block; font-size: 16px; font-weight: 900; letter-spacing: -.01em; direction: ltr; text-align: right; line-height: 1.2; }
.logo b i { font-style: normal; color: var(--red); }
.logo small { display: block; font-size: 11px; color: var(--tx-3); line-height: 1.4; }
.dark .logo small { color: #a1a1aa; }
.dark .logo b { color: #fff; }
.search { position: relative; flex: 1; max-width: 640px; }
.search input { width: 100%; height: 48px; border-radius: 16px; border: 1px solid #d4d4da; background: var(--soft); padding: 0 46px 0 104px; font-size: 16px; outline: none; transition: border-color .2s, background .2s; }
.search input:focus { border-color: var(--ink); background: #fff; }
.search .s-ico { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--tx-3); pointer-events: none; }
.search .s-btn { position: absolute; left: 6px; top: 6px; bottom: 6px; padding: 0 16px; border-radius: 12px; background: var(--ink); color: #fff; font-weight: 700; font-size: 13px; }
.search .s-btn:hover { background: var(--red); }
.suggest { position: absolute; inset-inline: 0; top: calc(100% + 8px); background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 24px 60px -20px rgb(0 0 0 / .35); overflow: hidden; z-index: 50; }
.suggest .s-head { padding: 10px 16px; font-size: 12px; color: var(--tx-2); border-bottom: 1px solid var(--soft); }
.suggest a.s-item { display: flex; align-items: center; gap: 12px; padding: 9px 16px; }
.suggest a.s-item:hover, .suggest a.s-item.on { background: var(--soft); }
.suggest .s-item img { width: 46px; height: 46px; border-radius: 10px; padding: 4px; flex: none; }
.suggest .s-item .nm { display: block; font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.suggest .s-item .mt { display: block; font-size: 11px; color: var(--tx-2); }
.suggest .s-item .pr { margin-inline-start: auto; font-size: 12px; font-weight: 800; white-space: nowrap; }
.suggest .s-all { display: block; text-align: center; padding: 12px; background: var(--soft); color: var(--red); font-weight: 700; font-size: 14px; }
.suggest .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 16px; }
.h-actions { display: flex; align-items: center; gap: 8px; margin-inline-start: auto; }
.h-phone { display: none; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 14px; }
.h-phone .ic { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--red-soft); color: var(--red); }
.h-phone .ic svg { width: 18px; height: 18px; }
.h-phone small { display: block; font-size: 11px; color: var(--tx-3); line-height: 1.3; }
.h-phone b { font-size: 14px; }
.cart-btn { position: relative; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px; border-radius: 16px; background: var(--ink); color: #fff; font-weight: 700; font-size: 14px; }
.cart-btn:hover { background: var(--red); }
.cart-btn svg { width: 20px; height: 20px; }
.cart-btn .lbl { display: none; }
.cart-btn .cnt { position: absolute; top: -7px; left: -7px; min-width: 24px; height: 24px; padding: 0 5px; border-radius: 99px; background: var(--red); border: 2px solid #fff; font-size: 11px; display: grid; place-items: center; }
.menu-btn { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 16px; border: 1px solid #d4d4da; }
.menu-btn svg { width: 20px; height: 20px; }
.m-search { padding-bottom: 12px; }
nav.mainnav { display: none; background: var(--ink); color: #fff; }
nav.mainnav .wrap { display: flex; align-items: stretch; height: 48px; }
.mega { position: relative; }
.mega > a { display: flex; align-items: center; gap: 8px; height: 100%; padding: 0 20px; background: var(--red); font-weight: 700; font-size: 14px; }
.mega > a svg { width: 16px; height: 16px; }
.mega-panel { position: absolute; top: 100%; right: 0; width: 760px; background: #fff; color: var(--tx); border-radius: 0 0 20px 20px; box-shadow: 0 30px 60px -20px rgb(0 0 0 / .4); padding: 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; opacity: 0; visibility: hidden; transform: translateY(8px); transition: .2s; }
.mega:hover .mega-panel, .mega:focus-within .mega-panel { opacity: 1; visibility: visible; transform: none; }
.mega-panel a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; }
.mega-panel a:hover { background: var(--soft); }
.mega-panel img { width: 42px; height: 42px; border-radius: 10px; padding: 3px; flex: none; }
.mega-panel b { display: block; font-size: 14px; }
.mega-panel small { display: block; font-size: 11px; color: var(--tx-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
.navlinks { display: flex; }
.navlinks a { position: relative; display: flex; align-items: center; padding: 0 16px; font-size: 14px; color: #cfcfd4; }
.navlinks a:hover, .navlinks a.on { color: #fff; }
.navlinks a::after { content: ""; position: absolute; inset-inline: 16px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--red); transform: scaleX(0); transition: transform .2s; }
.navlinks a:hover::after, .navlinks a.on::after { transform: scaleX(1); }
.nav-deal { margin: auto 0; margin-inline-start: auto; display: flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 99px; background: rgb(255 255 255 / .1); font-size: 12px; font-weight: 700; }
.nav-deal i { width: 6px; height: 6px; border-radius: 50%; background: var(--red); }

/* drawers */
.overlay { position: fixed; inset: 0; background: rgb(0 0 0 / .55); z-index: 70; }
.drawer { position: fixed; z-index: 71; background: #fff; display: flex; flex-direction: column; box-shadow: 0 0 60px rgb(0 0 0 / .3); }
.drawer.side { top: 0; bottom: 0; right: 0; width: min(88%, 380px); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); animation: slideR .3s ease; }
.drawer.bottom { left: 0; right: 0; bottom: 0; max-height: 86dvh; border-radius: 24px 24px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); animation: slideB .3s ease; }
.drawer.center { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(calc(100% - 32px), 440px); border-radius: 24px; max-height: 90dvh; overflow: auto; }
@keyframes slideR { from { transform: translateX(100%); } }
@keyframes slideB { from { transform: translateY(100%); } }
.drawer .d-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.drawer .d-body { flex: 1; overflow-y: auto; padding: 14px; }
.drawer .d-foot { padding: 14px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.x-btn { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--soft); flex: none; }
.x-btn svg { width: 16px; height: 16px; }
.m-links a { display: flex; justify-content: space-between; align-items: center; padding: 13px 14px; border-radius: 12px; font-weight: 700; }
.m-links a:hover, .m-links a.on { background: var(--red-soft); color: var(--red); }
details.m-acc { margin-top: 8px; background: var(--soft); border-radius: 12px; }
details.m-acc summary { list-style: none; padding: 12px 14px; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; }
details.m-acc summary::-webkit-details-marker { display: none; }
details.m-acc .acc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 0 8px 10px; }
details.m-acc .acc-grid a { padding: 8px 10px; border-radius: 8px; font-size: 14px; }
details.m-acc .acc-grid a:hover { background: #fff; }

/* hero */
.hero { position: relative; overflow: hidden; }
.hero .wrap { position: relative; display: grid; gap: 28px; align-items: center; padding-block: 40px 120px; }
.eyebrow-pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgb(255 255 255 / .15); background: rgb(255 255 255 / .05); border-radius: 99px; padding: 5px 14px; font-size: 12px; font-weight: 600; color: #e4e4e7; }
.eyebrow-pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--red); }
.hero h1 { margin-top: 22px; font-size: clamp(34px, 7vw, 56px); font-weight: 900; line-height: 1.3; letter-spacing: -.01em; }
.hero h1 span { background: linear-gradient(to left, #ff6a5f, #ff2a1f); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p.lead { margin: 18px 0 0; max-width: 34em; color: #d4d4d8; font-size: clamp(15px, 2vw, 18px); line-height: 2; }
.hero .ctas { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
.hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 480px; margin-top: 34px; }
.hero-stats div { border: 1px solid rgb(255 255 255 / .1); background: rgb(255 255 255 / .03); border-radius: 16px; padding: 12px; }
.hero-stats b { display: block; font-size: 18px; font-weight: 900; margin-top: 6px; }
.hero-stats small { color: #d4d4d8; font-size: 11px; }
.hero-stats svg { width: 20px; height: 20px; color: #ff5a4f; }
.hero-art { position: relative; width: 100%; max-width: 300px; aspect-ratio: 1; margin-inline: auto; }
.hero-art .ring { position: absolute; inset: 6%; border-radius: 50%; border: 1px solid rgb(255 255 255 / .1); }
.hero-art .ring2 { position: absolute; inset: 16%; border-radius: 50%; border: 1px dashed rgb(255 255 255 / .15); animation: spin 28s linear infinite; }
.hero-art .main { position: absolute; inset: 8%; width: 84%; height: 84%; object-fit: contain; filter: drop-shadow(0 40px 60px rgb(0 0 0 / .6)); }
.hero-art .float { position: absolute; display: none; width: 108px; height: 108px; border-radius: 24px; background: rgb(255 255 255 / .92); padding: 8px; box-shadow: 0 20px 40px rgb(0 0 0 / .4); animation: float 6s ease-in-out infinite; }
.hero-art .float.a { top: 2%; right: -2%; }
.hero-art .float.b { bottom: 6%; left: -2%; animation-delay: -3s; }
.hero-art .tag { position: absolute; top: 42%; left: -6px; background: var(--red); border-radius: 14px; padding: 8px 14px; font-weight: 800; font-size: 13px; box-shadow: 0 15px 40px -10px rgb(225 6 0 / .9); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes float { 50% { transform: translateY(-12px); } }

.trust { position: relative; z-index: 2; margin-top: -76px; }
.trust ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; box-shadow: 0 30px 60px -30px rgb(0 0 0 / .3); }
.trust li { display: flex; align-items: center; gap: 12px; background: #fff; padding: 14px; }
.trust li:last-child { grid-column: 1 / -1; }
.trust .ic { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; background: var(--ink); color: #fff; flex: none; }
.trust .ic svg { width: 20px; height: 20px; }
.trust b { display: block; font-size: 13px; font-weight: 800; }
.trust small { display: block; font-size: 11px; color: var(--tx-2); line-height: 1.6; }

/* sections */
section.sec { margin-top: 64px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 26px; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: var(--red); letter-spacing: .02em; margin: 0 0 6px; }
.eyebrow::before { content: ""; width: 24px; height: 3px; border-radius: 3px; background: var(--red); }
.sec-h h2 { font-size: clamp(22px, 3.4vw, 30px); font-weight: 900; }
.sec-h p { margin: 6px 0 0; color: var(--tx-2); font-size: 14px; max-width: 36em; }
.more { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 99px; padding: 7px 16px; font-size: 14px; font-weight: 700; transition: .2s; }
.more:hover { background: var(--ink); border-color: var(--ink); color: #fff; }
.more svg { width: 16px; height: 16px; }

/* finder */
.finder { border: 1px solid var(--line); border-radius: 24px; padding: 20px; background: #fff; box-shadow: 0 30px 60px -30px rgb(0 0 0 / .25); }
.finder-h { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.finder-h .ic { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; background: var(--red); color: #fff; flex: none; }
.finder-h .ic svg { width: 20px; height: 20px; }
.finder-h h2 { font-size: 17px; font-weight: 800; }
.finder-h p { margin: 0; font-size: 12px; color: var(--tx-2); }
.finder-g { display: grid; gap: 14px; }
.step { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--tx-2); margin-bottom: 8px; }
.step i { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: #fff; font-style: normal; font-size: 10px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button { height: 44px; border-radius: 12px; border: 1px solid #d4d4da; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: .2s; }
.seg button small { font-size: 10px; letter-spacing: .15em; opacity: .75; direction: ltr; }
.seg button.on { background: var(--red); border-color: var(--red); color: #fff; }
.sel { position: relative; }
.sel select { width: 100%; height: 44px; border-radius: 12px; border: 1px solid #d4d4da; background: #fff; padding: 0 14px 0 36px; appearance: none; font-size: 15px; }
.sel select:disabled { opacity: .55; }
.sel svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; pointer-events: none; opacity: .6; }

/* category cards */
.cat-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.cat-card { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: #fff; transition: transform .3s, box-shadow .3s, border-color .3s; height: 100%; }
.cat-card:hover { transform: translateY(-4px); border-color: var(--ink); box-shadow: 0 20px 40px -20px rgb(0 0 0 / .35); }
.cat-card .im { aspect-ratio: 1; padding: 14%; }
.cat-card .im img { width: 100%; height: 100%; object-fit: contain; transition: transform .5s; }
.cat-card:hover .im img { transform: scale(1.1); }
.cat-card .tx { padding: 12px 14px; }
.cat-card b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat-card small { font-size: 11px; color: var(--tx-2); }
.cat-card p { margin: 6px 0 0; font-size: 12px; color: var(--tx-2); line-height: 1.8; }

/* product card */
.p-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr; gap: 14px; }
.p-grid > li { display: flex; }
.card { position: relative; display: flex; flex-direction: column; width: 100%; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: #fff; transition: transform .3s, box-shadow .3s; }
.card:hover { transform: translateY(-4px); box-shadow: 0 24px 48px -24px rgb(11 11 13 / .35); }
.card .im { position: relative; aspect-ratio: 4 / 3.4; }
.card .im img { width: 100%; height: 100%; object-fit: contain; padding: 8%; transition: transform .5s; }
.card:hover .im img { transform: scale(1.07) rotate(-2deg); }
.card.out .im img { opacity: .5; filter: grayscale(1); }
.badges { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.badge { display: inline-block; border-radius: 7px; padding: 1px 8px; font-size: 11px; font-weight: 800; background: var(--red); color: #fff; }
.badge.dark { background: var(--ink); }
.badge.light { background: #fff; color: var(--ink); border: 1px solid var(--line); }
.brand-tag { position: absolute; top: 12px; left: 12px; border-radius: 7px; padding: 1px 8px; font-size: 10px; font-weight: 900; letter-spacing: .08em; direction: ltr; background: var(--ink); color: #fff; }
.brand-tag.honda { background: #fff; color: var(--ink); border: 1px solid var(--line); }
.card .bd { display: flex; flex-direction: column; gap: 9px; padding: 14px 16px 16px; flex: 1; }
.card .row1 { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
.sku { font-family: var(--mono); background: var(--soft); border-radius: 6px; padding: 1px 6px; font-weight: 700; direction: ltr; font-size: 11px; }
.star { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; }
.star svg { width: 13px; height: 13px; fill: #f5b301; color: #e0a200; }
.card h3 { font-size: 15px; font-weight: 800; line-height: 1.55; min-height: 2.9em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* rails */

/* deals */

.model-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

.faq { display: grid; gap: 10px; }

/* product page */

.pd-tags { display: flex; flex-wrap: wrap; gap: 6px; }

.code svg { width: 16px; height: 16px; color: var(--tx-3); }
.fitbox { border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 20px; }
.fitbox h2 { font-size: 14px; font-weight: 900; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }

/* cart */
.steps { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--tx-2); flex-wrap: wrap; }

/* ---------- toast ---------- */
function toast(title, sub, action, err) {
  const el = document.createElement("div");
  el.className = "toast" + (err ? " err" : "");
  el.innerHTML = `${ic(err ? "x" : "checkC")}<span><b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ""}</span>${action ? `<a class="ta" href="${action.href || "#"}" data-tact="1">${action.label}</a>` : ""}`;
  if (action && action.fn) el.querySelector(".ta").addEventListener("click", (e) => { e.preventDefault(); action.fn(); el.remove(); });
  $("#toasts").appendChild(el);
  while ($("#toasts").children.length > 3) $("#toasts").firstChild.remove();
  setTimeout(() => el.remove(), 4000);
}

/* ---------- router ---------- */
let current = "";
function render(opts = {}) {
  const h = decodeURIComponent(location.hash.slice(1)) || "home";
  const changed = h !== current;
  if (changed) { ui.gview = 0; ui.qty = 1; if (!opts.keepFilters) { ui.f = freshFilters(); ui.limit = 12; } if (h === "nissan" || h === "honda") finder = { b: h, m: "", y: "" }; }
  current = h;
  let html, title = "فروشگاه حمیدی";
  if (h === "home") html = home();
  else if (h === "shop") { html = shop(); title = "فروشگاه"; }
  else if (h === "nissan" || h === "honda") { html = brandPage(h); title = "لوازم یدکی " + brand(h).nameFa; }
  else if (h.startsWith("m-")) { const [, b, ...m] = h.split("-"); const mid = m.join("-"); if (brand(b) && model(mid)) { html = modelPage(b, mid); title = `${brand(b).nameFa} ${model(mid).nameFa}`; } }
  else if (h === "categories") { html = categories(); title = "دسته‌بندی‌ها"; }
  else if (h.startsWith("c-") && cat(h.slice(2))) { html = categoryPage(h.slice(2)); title = cat(h.slice(2)).nameFa; }
  else if (h.startsWith("p-") && bySlug.get(h.slice(2))) { const p = bySlug.get(h.slice(2)); html = productPage(p); title = p.name; }
  else if (h === "search") { html = search(); title = "جستجو"; }
  else if (h === "cart") { html = cartPage(); title = "سبد خرید"; }
  else if (h === "contact") { html = contact(); title = "تماس با ما"; }
  else if (h === "about") { html = about(); title = "درباره ما"; }
  if (!html) html = `<div class="wrap empty" style="margin-top:40px"><span class="ic">${ic("search")}</span><h2>صفحه مورد نظر پیدا نشد</h2><div class="row"><a class="btn btn-red" href="#home">صفحه اصلی</a></div></div>`;
  $("#main").innerHTML = html;
  document.title = title + " | HAMIDI AUTO PARTS";
  $("#navLinks").innerHTML = NAV.map(([r, l]) => `<a href="#${r}" class="${h === r || (r !== "home" && h.startsWith(r)) || (r === "nissan" && h.startsWith("m-nissan")) || (r === "honda" && h.startsWith("m-honda")) || (r === "categories" && h.startsWith("c-")) ? "on" : ""}">${l}</a>`).join("");
  if (changed && !opts.keepScroll) window.scrollTo({ top: 0, behavior: "instant" });
  closeSuggest(); tick();
}
function rerender() { const y = scrollY; render({ keepFilters: true, keepScroll: true }); window.scrollTo({ top: y, behavior: "instant" }); }
function go(h) { if (location.hash.slice(1) === h) { ui._keep = false; rerender(); } else location.hash = h; }
window.addEventListener("hashchange", () => { const k = ui._keep; ui._keep = false; render({ keepFilters: k }); });

/* ---------- countdown ---------- */
function tick() { const el = $("#cd"); if (!el) return; const t = new Date(); t.setHours(24, 0, 0, 0); let s = Math.max(0, Math.floor((t - Date.now()) / 1000)); const v = [Math.floor(s / 3600), Math.floor((s % 3600) / 60), s % 60]; el.innerHTML = v.map((n, i) => `<div><b>${fa(String(n).padStart(2, "0"))}</b><small>${["ساعت", "دقیقه", "ثانیه"][i]}</small></div>${i < 2 ? "<span>:</span>" : ""}`).join(""); }
setInterval(tick, 1000);

/* ---------- live search ---------- */
let sTimer;
function suggestFor(input) {
  const box = input.closest(".search").querySelector(".suggest"); const q = input.value.trim();
  if (q.length < 2) { box.innerHTML = `<div class="s-head">جستجوهای پرتکرار</div><div class="chips" style="padding:12px 16px">${["لنت ترمز", "کمک‌فنر مورانو", "واترپمپ", "15208-65F0E", "سیبک", "تسمه تایم"].map((s) => `<button class="chip" data-act="sq" data-v="${s}">${s}</button>`).join("")}</div>`; }
  else { const hits = D.products.filter((p) => match(p, q)).sort((a, b) => b.sold - a.sold); box.innerHTML = hits.length ? `<div class="s-head">${fa(hits.length)} قطعه یافت شد</div>${hits.slice(0, 6).map((p, i) => `<a class="s-item" href="#${route(p)}" data-i="${i}"><img class="studio" src="${img(p.img)}" alt=""><span style="min-width:0"><span class="nm">${esc(p.name)}</span><span class="mt"><span class="ltr">${p.sku}</span> · ${cat(p.category).nameFa}</span></span><span class="pr">${money(p.price)} <small class="muted" style="font-weight:400">تومان</small></span></a>`).join("")}<a class="s-all" href="#search" data-act="sall">مشاهده همه نتایج برای «${esc(q)}» ←</a>` : `<div style="padding:24px;text-align:center;font-size:14px" class="muted">قطعه‌ای با «${esc(q)}» پیدا نشد.<a href="#contact" style="display:block;color:var(--red);font-weight:700;margin-top:6px">استعلام قطعه از کارشناس ←</a></div>`; }
  box.hidden = false; input.setAttribute("aria-expanded", "true");
}
function closeSuggest() { document.querySelectorAll(".suggest").forEach((b) => (b.hidden = true)); document.querySelectorAll(".search input").forEach((i) => i.setAttribute("aria-expanded", "false")); }
document.addEventListener("input", (e) => {
  if (e.target.matches(".search input")) { clearTimeout(sTimer); const t = e.target; sTimer = setTimeout(() => suggestFor(t), 120); }
});
document.addEventListener("focusin", (e) => { if (e.target.matches(".search input")) suggestFor(e.target); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeSuggest(); closeLayer(); }
  if (e.target.matches(".search input") && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    const box = e.target.closest(".search").querySelector(".suggest"); const items = [...box.querySelectorAll(".s-item")]; if (!items.length) return; e.preventDefault();
    let i = items.findIndex((x) => x.classList.contains("on")); items.forEach((x) => x.classList.remove("on"));
    i = e.key === "ArrowDown" ? Math.min(items.length - 1, i + 1) : Math.max(-1, i - 1); if (i >= 0) items[i].classList.add("on");
  }
});
document.addEventListener("pointerdown", (e) => { if (!e.target.closest(".search")) closeSuggest(); });

}

/* ---------- actions ---------- */
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-act]"); if (!t) { if (e.target.closest(".suggest a")) closeSuggest(); return; }
  const a = t.dataset.act, v = t.dataset.v, f = ui.f;
  const refilter = () => { ui.limit = 12; rerender(); if ($("#layer .drawer.bottom")) $("#layer .drawer").innerHTML = filtersHTML(); };
  switch (a) {

    case "close": closeLayer(); break;
    case "fab": { const o = $("#fab .opts"); o.hidden = !o.hidden; t.setAttribute("aria-expanded", String(!o.hidden)); t.innerHTML = ic(o.hidden ? "chat" : "x"); break; }
    case "rail": { const r = t.parentElement.querySelector(".rail"); r.scrollBy({ left: Number(t.dataset.dir) * r.clientWidth * 0.8, behavior: "smooth" }); break; }
    case "fb": finder.b = t.dataset.b; finder.m = ""; finder.y = ""; $("#finder").outerHTML = finderHTML(); break;
    case "deals": e.preventDefault(); ui._keep = true; ui.f = freshFilters(); ui.f.sort = "discount"; ui.limit = 12; go("shop"); break;
    case "fopen": openLayer("bottom", filtersHTML(), "فیلتر محصولات"); break;
    case "fcat": f.cats = f.cats.includes(v) ? f.cats.filter((x) => x !== v) : [...f.cats, v]; refilter(); break;
    case "fbrand": f.brand = f.brand === v ? "" : v; refilter(); break;
    case "fyear": f.year = f.year === Number(v) ? 0 : Number(v); refilter(); break;
    case "fprice": f.price = f.price === v ? "" : v; refilter(); break;
    case "fstock": f.stock = !f.stock; refilter(); break;
    case "fsort": f.sort = v; refilter(); break;
    case "fclear": ui.f = freshFilters(); refilter(); break;
    case "more": ui.limit += 12; rerender(); break;
    case "q": ui.q = v; ui.f = freshFilters(); rerender(); break;
    case "sq": { const inp = t.closest(".search").querySelector("input"); inp.value = v; suggestFor(inp); inp.focus(); break; }
    case "sall": e.preventDefault(); ui.q = t.closest(".search").querySelector("input").value.trim(); ui.f = freshFilters(); ui._keep = current !== "search"; closeSuggest(); go("search"); window.scrollTo({ top: 0 }); break;
    case "gview": ui.gview = Number(v); rerender(); break;
    case "pq": ui.qty = Math.max(1, ui.qty + Number(v)); rerender(); break;
    case "cq": { const l = cart.find((x) => x.id === t.dataset.id); l.qty = Math.max(1, Math.min(maxQ(prod(l.id)), l.qty + Number(v))); saveCart(); rerender(); break; }
    case "rm": { const i = cart.findIndex((x) => x.id === t.dataset.id); const [l] = cart.splice(i, 1); saveCart(); rerender(); toast("از سبد خرید حذف شد", prod(l.id).name, { label: "بازگردانی", fn: () => { cart.splice(i, 0, l); saveCart(); if (current === "cart") rerender(); } }); break; }
    case "clear": { const snap = cart.slice(); cart = []; saveCart(); rerender(); toast("سبد خرید خالی شد", "", { label: "بازگردانی", fn: () => { cart = snap; saveCart(); if (current === "cart") rerender(); } }); break; }
    case "uncoupon": ui.coupon = null; rerender(); break;
    case "checkout": ui.checkout = "form"; openLayer("center", checkoutHTML(), "ثبت سفارش"); break;
    case "copy": try { await navigator.clipboard.writeText(v); toast(`${t.dataset.l} کپی شد`, v); } catch { toast(t.dataset.l, v); } break;
    case "topic": ui.topic = Number(v); t.parentElement.querySelectorAll(".topic").forEach((b, i) => { b.classList.toggle("on", i === ui.topic); b.setAttribute("aria-checked", String(i === ui.topic)); }); break;
  }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "fm") { finder.m = e.target.value; finder.y = ""; $("#finder").outerHTML = finderHTML(); $("#fm").focus(); }
  if (e.target.id === "fy") finder.y = e.target.value;
  if (e.target.id === "fsortsel") { ui.f.sort = e.target.value; ui.limit = 12; rerender(); }
  if (e.target.name === "ship") { ui.ship = e.target.value; rerender(); }
});
document.addEventListener("submit", (e) => {
  e.preventDefault(); const fm = e.target;
  if (fm.id === "finder") { if (!finder.b) return; ui._keep = !!finder.y; ui.f = freshFilters(); if (finder.y) ui.f.year = Number(finder.y); ui.limit = 12; go(finder.m ? `m-${finder.b}-${finder.m}` : finder.b); return; }
  const k = fm.dataset.form;
  if (k === "search") { const q = fm.querySelector("input").value.trim(); if (q.length < 2) return; const it = fm.parentElement.querySelector(".s-item.on"); closeSuggest(); fm.querySelector("input").blur(); if (it) { location.hash = it.getAttribute("href"); return; } ui.q = q; ui.f = freshFilters(); ui._keep = current !== "search"; go("search"); }
  if (k === "fsearch") { ui.q = fm.querySelector("input").value.trim(); rerender(); }
  if (k === "coupon") { const c = fm.querySelector("input").value.trim().toUpperCase(); if (COUPONS[c]) { ui.coupon = c; rerender(); toast(`کد تخفیف ${fa(COUPONS[c])}٪ اعمال شد`); } else toast("کد تخفیف معتبر نیست", "در نسخه نمایشی از کد HAMIDI10 استفاده کنید.", null, true); }
  if (k === "checkout") { ui.checkout = "done"; ui.order = "HAP-" + Math.floor(100000 + Math.random() * 900000); $("#layer .drawer").innerHTML = checkoutHTML(); }
  if (k === "contact") { fm.reset(); toast("پیام شما ارسال شد", "در نسخه نهایی، کارشناسان ما با شما تماس می‌گیرند."); }
});

chrome();
render();
})();
</script>
