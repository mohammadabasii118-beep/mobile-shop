name: mafia_ghab_editor
description: "استودیو مافیای قاب — ادیتور قسمت‌های سریال مافیای قاب (اندروید + ویندوز)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path: ^1.9.1
  path_provider: ^2.1.6
  file_picker: ^13.3.0
  share_plus: ^13.3.1
  permission_handler: ^13.0.2
  ffmpeg_kit_flutter_new: ^4.6.7
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/season1.json

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: "assets/fonts/Vazirmatn[wght].ttf"
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf
