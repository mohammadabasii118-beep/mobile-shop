services:
  shop:
    build: .
    ports: ["3000:3000"]
    environment:
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?رمز مدیر را در فایل .env تنظیم کنید}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
      # SEED_ARGS: ""            # برای داده‌ی نمونه‌ی کامل، خالی بگذارید؛ پیش‌فرض: --empty
      # PAYMENT_MODE: test       # فقط برای آزمایش درگاه؛ در فروش واقعی تنظیم نکنید
      # INSECURE_COOKIES: "1"    # فقط اگر پشت HTTPS نیستید
    volumes:
      - shop-data:/data
    restart: unless-stopped
volumes:
  shop-data:
