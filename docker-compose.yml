services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vpn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vpnbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpn -d vpnbot"]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vpn:${POSTGRES_PASSWORD}@db:5432/vpnbot?schema=public
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the bot reach an SSH tunnel to the panel running on the host (deploy/panel-tunnel.service)
    ports:
      - "127.0.0.1:3000:3000"   # put a TLS reverse proxy (Caddy/nginx) in front for the bank webhook
    volumes:
      - receipts:/app/data/receipts
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  pgdata:
  receipts:
