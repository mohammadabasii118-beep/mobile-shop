<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل چندلوکیشن</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="icon" href="data:,">
<style>
:root{color-scheme:light}
[hidden]{display:none!important}
body{margin:0}
/* Layout: RTL admin shell — fixed sidebar of sections, main area with summary on top and operable tables below */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface2:#eaeef2; --line:#d9e0e6;
  --fg:#12202b; --muted:#5d6e7c; --accent:#0b7a6e; --accent-fg:#ffffff; --accent-soft:#d5efeb;
  --good:#1b8a4b; --warn:#b7791f; --bad:#c0392b;
  --font:'Vazirmatn',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1419; --surface:#141d24; --surface2:#1c2831; --line:#26343f;
  --fg:#e4ecf1; --muted:#8a9ba8; --accent:#2fc4b2; --accent-fg:#06211d; --accent-soft:#12332f;
  --good:#4cc582; --warn:#e0a84a; --bad:#ec6b5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1419; --surface:#141d24; --surface2:#1c2831; --line:#26343f;
  --fg:#e4ecf1; --muted:#8a9ba8; --accent:#2fc4b2; --accent-fg:#06211d; --accent-soft:#12332f;
  --good:#4cc582; --warn:#e0a84a; --bad:#ec6b5c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.7;direction:rtl}
button,input,select{font:inherit;color:inherit}
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}
nav{background:var(--surface);border-inline-end:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start}
.brand{font-weight:700;font-size:17px;padding:4px 10px 14px;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
nav button{all:unset;cursor:pointer;padding:8px 12px;border-radius:8px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
nav button:hover{background:var(--surface2)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav .sp{flex:1}
main{padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:0 0 10px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:8px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.btn.sm{padding:2px 10px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:right;color:var(--muted);font-weight:500;font-size:12px;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:0 9px;border-radius:99px;font-size:12px;background:var(--surface2);color:var(--muted)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.bar{height:6px;border-radius:3px;background:var(--surface2);min-width:80px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.cc{font-family:var(--mono);font-size:11px;background:var(--surface2);padding:1px 6px;border-radius:4px;margin-inline-end:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.proto{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.proto h3{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.proto small{color:var(--muted)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:right}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;cursor:pointer}
input[type=text],input[type=number],select{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:100%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(640px,100%);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:flex;gap:6px;align-items:center;background:var(--surface2);padding:3px 10px;border-radius:99px;cursor:pointer;font-size:13px}
.links{display:flex;flex-direction:column;gap:6px}
.link{display:flex;gap:8px;align-items:center;background:var(--surface2);border-radius:8px;padding:6px 10px;min-width:0}
.link code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12px;direction:ltr;text-align:left}
pre{background:var(--surface2);border-radius:8px;padding:12px;margin:0;overflow-x:auto;font-family:var(--mono);font-size:12px;direction:ltr;text-align:left}
.note{background:var(--accent-soft);color:var(--fg);border-radius:8px;padding:8px 12px;font-size:13px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:99px;z-index:20}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  nav{position:sticky;height:auto;flex-direction:row;overflow-x:auto;padding:8px;z-index:5;border-inline-end:0;border-bottom:1px solid var(--line)}
  nav .brand,nav .sp{display:none}
  nav button{white-space:nowrap}
  .cols{grid-template-columns:1fr}
}
</style>

</head><body>
<div class="shell">
  <nav id="nav" aria-label="بخش‌ها">
    <div class="brand"><i></i>پنل چندلوکیشن</div>
    <button data-tab="dash" aria-current="true">داشبورد</button>
    <button data-tab="nodes">لوکیشن‌ها <span class="pill" id="nNodes"></span></button>
    <button data-tab="protos">پروتکل‌ها</button>
    <button data-tab="users">کاربران <span class="pill" id="nUsers"></span></button>
    <div class="sp"></div>
    <button id="backupBtn">دانلود پشتیبان</button>
    <button id="themeBtn">تغییر تم</button>
    <button id="logoutBtn">خروج</button>
  </nav>
  <main>
    <header class="top"><h1 id="title"></h1><div id="actions"></div></header>
    <section id="view"></section>
  </main>
</div>
<div class="modal" id="modal" hidden><div class="box" id="box"></div></div>
<div class="toast" id="toast" hidden></div>
<script src="/app.js"></script>
</body></html>
