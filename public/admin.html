<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>پنل مدیریت</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
body{padding-bottom:0}
.adm{display:grid;gap:14px;padding:14px;max-width:1300px;margin:0 auto}
.side{background:#fff;border-radius:var(--r);padding:10px;box-shadow:var(--shadow);display:flex;gap:6px;overflow-x:auto;position:sticky;top:0;z-index:20}
.side button{white-space:nowrap;padding:9px 14px;border-radius:12px;font-weight:600;color:var(--muted)}
.side button.on{background:linear-gradient(90deg,var(--p),var(--p2));color:#fff}
.panel{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--shadow);overflow-x:auto}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--bg);border-radius:14px;padding:14px}.stat b{display:block;font-size:20px}.stat span{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:13px;white-space:nowrap}
.row-a{display:flex;gap:6px;flex-wrap:wrap}
.modal-bg{position:fixed;inset:0;background:rgba(15,10,40,.5);z-index:80;display:grid;place-items:center;padding:12px;overflow:auto}
.modal{background:#fff;border-radius:20px;padding:20px;width:min(640px,100%);max-height:92vh;overflow:auto}
.modal h3{margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumb{width:52px;height:52px;border-radius:10px;background:var(--bg) center/cover;display:inline-grid;place-items:center;font-size:24px}
.optbox{border:1px dashed var(--line);border-radius:14px;padding:10px;margin-bottom:8px;display:grid;gap:8px}
.imgs{display:flex;gap:8px;flex-wrap:wrap}.imgs .im{position:relative}.imgs .im button{position:absolute;top:-6px;left:-6px;background:var(--bad);color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px}
.login{max-width:360px;margin:12vh auto;background:#fff;padding:26px;border-radius:22px;box-shadow:var(--shadow);text-align:center}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}.tools input,.tools select{width:auto;flex:1;min-width:140px}
@media(min-width:900px){.adm{grid-template-columns:200px 1fr;align-items:start}.side{flex-direction:column;overflow:visible}.side button{text-align:right}.stats{grid-template-columns:repeat(5,1fr)}}
</style></head>
<body><div id="root"></div><div class="toast" id="toast"></div><script src="/admin.js"></script></body></html>
